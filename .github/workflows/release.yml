name: Release packages

# Manual release. Packages are built and verified once by the shared verification
# workflow; the publish jobs upload exactly those artifacts and never rebuild.

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish protocol and UI packages to npm
        required: true
        type: boolean
        default: false
      publish_pypi:
        description: Publish the Python runtime to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Require the default branch
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases may only run from refs/heads/main, got $GITHUB_REF" >&2
            exit 1
          fi

  verify:
    needs: guard
    uses: ./.github/workflows/verify.yml

  publish-npm:
    name: Publish npm packages
    if: inputs.publish_npm && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm trusted publishing requires npm 11.5.1 or newer; Node 22 bundles an older npm.
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-packages
          path: npm-dist
      # Alphabetical order publishes agent-protocol before agent-ui, which depends on it.
      - name: Publish the verified tarballs
        run: |
          for tarball in npm-dist/*.tgz; do
            npm publish "$tarball" --provenance --access public --tag alpha
          done

  publish-pypi:
    name: Publish PyPI package
    if: inputs.publish_pypi && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kaiwen-agent/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
