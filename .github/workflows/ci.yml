name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  # Single stable status name for branch protection, independent of matrix changes.
  ci-gate:
    name: CI gate
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = "success"
