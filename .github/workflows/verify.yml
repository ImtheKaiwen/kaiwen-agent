name: Verify

# Reusable verification shared by pull-request CI and the release workflow so that a
# release is gated by exactly the checks a pull request must pass.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --config pyproject.toml --check src tests examples scripts
      - run: python -m ruff check --config pyproject.toml src tests examples scripts
      - run: python -m mypy --no-incremental src/kaiwen_agent scripts/check_release.py
      - name: Type-check examples
        shell: bash
        run: |
          for example in simple-runtime autonomous-single-agent software-agent-team \
            speech-pipeline validation-consumer legal-domain-validation coding-kit-fake \
            coding-kit-openai coding-simple-chat coding-simple-agent coding-simple-team \
            coding-simple-ollama coding-simple-custom-host coding-docker-evidence \
            coding-evidence-freshness coding-agent-worker; do
            echo "mypy examples/$example"
            python -m mypy --no-incremental "examples/$example/main.py"
          done
      - name: Check release metadata consistency
        run: python scripts/check_release.py metadata

  python-tests:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -c "import kaiwen_agent, kaiwen_agent.kits.coding"
      - name: Run tests
        # Linux runners provide a real Docker engine; the container integration tests
        # are required there. Windows runners cannot run Linux containers and skip them.
        env:
          KAIWEN_REQUIRE_DOCKER: ${{ runner.os == 'Linux' && '1' || '' }}
        run: python -m pytest -rs
      - name: Run the Docker evidence examples against a real engine
        if: runner.os == 'Linux'
        env:
          KAIWEN_REQUIRE_DOCKER: "1"
          KAIWEN_DOCKER_IMAGE: python@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
        run: |
          docker pull --quiet "$KAIWEN_DOCKER_IMAGE"
          python examples/coding-docker-evidence/main.py
          python examples/coding-evidence-freshness/main.py
          python examples/coding-agent-worker/main.py
      - name: Run executable examples
        shell: bash
        env:
          # Examples print non-ASCII text; Windows redirected stdout defaults to cp1252.
          PYTHONUTF8: "1"
        run: |
          for example in simple-runtime autonomous-single-agent software-agent-team \
            speech-pipeline coding-simple-chat coding-simple-agent coding-simple-team \
            coding-simple-custom-host; do
            echo "run examples/$example"
            python "examples/$example/main.py" > /dev/null
          done
          python examples/validation-consumer/main.py "$RUNNER_TEMP/todo-consumer" > /dev/null
          python examples/legal-domain-validation/main.py "$RUNNER_TEMP/legal-consumer" > /dev/null

  python-package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[release]"
      - name: Build wheel and sdist
        run: python -m build --outdir dist
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Validate distribution contents
        run: python scripts/check_release.py dist dist
      - name: Install and smoke-test the wheel and the sdist in clean environments
        shell: bash
        run: |
          for kind in whl tar.gz; do
            python -m venv "$RUNNER_TEMP/smoke-$kind"
            "$RUNNER_TEMP/smoke-$kind/bin/python" -m pip install dist/*.$kind
            (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke-$kind/bin/python" - <<'PY'
          from importlib.resources import files

          import kaiwen_agent
          import kaiwen_agent.kits.coding  # noqa: F401

          assert "site-packages" in kaiwen_agent.__file__, kaiwen_agent.__file__
          assert files("kaiwen_agent").joinpath("py.typed").is_file()
          prompt = files("kaiwen_agent.kits.coding.prompts").joinpath("base.md")
          assert prompt.read_text(encoding="utf-8").strip()
          assert any(files("kaiwen_agent.kits.coding.templates.docs").iterdir())
          print("installed", kaiwen_agent.__file__)
          PY
            )
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:protocol
      - run: npm test
      - run: npm run typecheck
      - run: npm run pack:check
      - name: Pack npm tarballs
        if: matrix.node == '22'
        run: |
          mkdir npm-dist
          npm pack --pack-destination npm-dist \
            --workspace @imthekaiwen/agent-protocol \
            --workspace @imthekaiwen/agent-ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == '22'
        with:
          name: npm-packages
          path: npm-dist/
          if-no-files-found: error
          retention-days: 14
